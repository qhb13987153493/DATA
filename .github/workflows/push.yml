name: 期货速查卡定时推送
on:
  schedule:
    # UTC时间，北京时间 = UTC + 8
    - cron: '5,10,15 1 * * 1-5'   # 北京时间 09:05, 09:10, 09:15 尝试触发
    - cron: '35,40 5 * * 1-5'     # 北京时间 13:35, 13:40 尝试触发
    - cron: '5,10,15 13 * * 1-5'  # 北京时间 21:05, 21:10, 21:15 尝试触发
    - cron: '5 7 * * 1-5'   # 北京时间 15:05（收盘记录数据）
  workflow_dispatch:

permissions:
  contents: write # 必须要有这行，才能把数据存回仓库

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install requests pandas numpy
      - name: 运行推送脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python futures_push.py
      - name: 保存自建数据库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kline_data.json || true
          git commit -m "update kline data" || true
          git push

name: 期货速查卡定时推送
on:
  schedule:
    # UTC时间，北京时间需 +8 小时
    - cron: '5 1 * * 1-5'   # 北京时间 09:05
    - cron: '30 2 * * 1-5'  # 北京时间 10:30
    - cron: '35 5 * * 1-5'  # 北京时间 13:35
    - cron: '0 6 * * 1-5'   # 北京时间 14:00
    - cron: '5 13 * * 1-5'  # 北京时间 21:05
  workflow_dispatch:        # 允许手动触发测试

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install requests pandas akshare
      - name: 运行推送脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python futures_push.py
